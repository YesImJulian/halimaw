<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Planet Quiz</title>
	<style>
		:root {
			--violet-800: #4d2780;
			--violet-700: #6336a1;
			--violet-600: #8254d6;
			--violet-100: #f1ebff;
			--violet-050: #fbf9ff;
			--ink: #26143f;
			--muted: #716580;
			--white: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-width: 320px;
			min-height: 100vh;
			color: var(--ink);
			background: linear-gradient(145deg, var(--white), var(--violet-050));
			font-family: Georgia, 'Times New Roman', serif;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: 100%;
			padding: 24px max(24px, calc((100% - 1120px) / 2));
			background: var(--violet-800);
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			color: var(--white);
			font-size: 0.85rem;
			font-weight: bold;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		.brand-mark {
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: var(--white);
			box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.18);
		}

		.home-link {
			display: grid;
			width: 40px;
			height: 40px;
			place-items: center;
			border-radius: 50%;
			color: var(--violet-800);
			background: var(--white);
			font-family: Arial, sans-serif;
			font-size: 1.55rem;
			line-height: 1;
			text-decoration: none;
			transition: transform 180ms ease, background 180ms ease;
		}

		.home-link:hover,
		.home-link:focus-visible {
			background: #f1ebff;
			transform: translateX(-3px);
		}

		.home-link:focus-visible {
			outline: 3px solid rgba(255, 255, 255, 0.75);
			outline-offset: 4px;
		}

		main {
			width: min(780px, calc(100% - 36px));
			margin: 0 auto;
			padding: 54px 0 70px;
		}

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		.quiz-heading {
			margin-bottom: 28px;
			text-align: center;
		}

		.quiz-heading p {
			margin: 0 0 10px;
			color: var(--violet-600);
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.72rem;
			font-weight: bold;
			letter-spacing: 0.18em;
			text-transform: uppercase;
		}

		.reset-leaderboard {
			margin: 0 0 10px;
			padding: 0;
			border: 0;
			color: var(--violet-600);
			background: transparent;
			cursor: pointer;
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.72rem;
			font-weight: bold;
			letter-spacing: 0.18em;
			text-transform: uppercase;
		}

		.reset-leaderboard:hover,
		.reset-leaderboard:focus-visible {
			color: var(--violet-800);
			text-decoration: underline;
			text-underline-offset: 4px;
		}

		.reset-leaderboard:focus-visible {
			outline: 3px solid #d7c4ff;
			outline-offset: 3px;
		}

		.player-setup {
			padding: clamp(26px, 5vw, 42px);
			border: 1px solid rgba(130, 84, 214, 0.16);
			border-radius: 14px;
			background: rgba(255, 255, 255, 0.9);
			box-shadow: 0 18px 45px rgba(77, 39, 128, 0.1);
			text-align: center;
		}

		.player-setup h2 {
			margin: 0 0 10px;
			font-size: clamp(1.6rem, 4vw, 2.2rem);
			font-weight: normal;
		}

		.player-setup p {
			margin: 0 auto 24px;
			color: var(--muted);
			font-family: 'Trebuchet MS', sans-serif;
			line-height: 1.5;
		}

		.name-form {
			display: flex;
			gap: 10px;
			max-width: 500px;
			margin: 0 auto;
		}

		.name-input {
			min-width: 0;
			flex: 1;
			padding: 13px 15px;
			border: 1px solid #d7c4ff;
			border-radius: 8px;
			color: var(--ink);
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.95rem;
		}

		.name-input:focus {
			border-color: var(--violet-600);
			outline: 3px solid #d7c4ff;
			outline-offset: 1px;
		}

		.name-submit {
			padding: 13px 19px;
			border: 0;
			border-radius: 8px;
			color: var(--white);
			background: var(--violet-800);
			cursor: pointer;
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.9rem;
			font-weight: bold;
		}

		.name-submit:hover,
		.name-submit:focus-visible {
			background: var(--violet-600);
		}

		.name-submit:focus-visible {
			outline: 3px solid #d7c4ff;
			outline-offset: 3px;
		}

		.name-error {
			min-height: 20px;
			margin: 10px 0 0 !important;
			color: #9b3f32 !important;
			font-size: 0.82rem;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.2rem, 6vw, 3.8rem);
			font-weight: normal;
			line-height: 1;
		}

		.progress-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 10px;
			color: var(--muted);
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.78rem;
			font-weight: bold;
			letter-spacing: 0.05em;
			text-transform: uppercase;
		}

		.timer {
			padding: 6px 11px;
			border-radius: 99px;
			color: var(--violet-800);
			background: var(--violet-100);
			font-size: 0.75rem;
		}

		.timer.warning {
			color: #9b3f32;
			background: #ffe8e4;
		}

		.exp {
			color: var(--violet-600);
		}

		.progress-track {
			height: 8px;
			margin-bottom: 24px;
			border-radius: 99px;
			background: var(--violet-100);
		}

		.progress-bar {
			width: 5%;
			height: 100%;
			border-radius: inherit;
			background: var(--violet-600);
			transition: width 250ms ease;
		}

		.question-card {
			padding: clamp(24px, 5vw, 42px);
			border: 1px solid rgba(130, 84, 214, 0.16);
			border-radius: 14px;
			background: rgba(255, 255, 255, 0.9);
			box-shadow: 0 18px 45px rgba(77, 39, 128, 0.1);
		}

		.question-number {
			margin: 0 0 13px;
			color: var(--violet-600);
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.75rem;
			font-weight: bold;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		.question-text {
			margin: 0 0 28px;
			font-size: clamp(1.35rem, 3vw, 2rem);
			font-weight: normal;
			line-height: 1.25;
		}

		.answers {
			display: grid;
			gap: 12px;
		}

		.answer {
			display: grid;
			grid-template-columns: 34px 1fr;
			align-items: center;
			gap: 13px;
			width: 100%;
			padding: 14px 16px;
			border: 1px solid var(--violet-300, #d7c4ff);
			border-radius: 9px;
			color: var(--ink);
			background: var(--white);
			cursor: pointer;
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.95rem;
			line-height: 1.4;
			text-align: left;
			transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
		}

		.answer:hover,
		.answer:focus-visible {
			border-color: var(--violet-600);
			background: var(--violet-050);
			transform: translateX(3px);
		}

		.answer:disabled {
			cursor: default;
		}

		.answer.correct {
			border-color: #2e8967;
			color: #14533e;
			background: #e5f7ef;
		}

		.answer.correct .answer-letter {
			color: var(--white);
			background: #2e8967;
		}

		.answer.incorrect {
			border-color: #b64e44;
			color: #7b2d27;
			background: #ffebe8;
		}

		.answer.incorrect .answer-letter {
			color: var(--white);
			background: #b64e44;
		}

		.answer:focus-visible,
		.restart-button:focus-visible {
			outline: 3px solid var(--violet-300, #d7c4ff);
			outline-offset: 3px;
		}

		.answer-letter {
			display: grid;
			width: 30px;
			height: 30px;
			place-items: center;
			border-radius: 50%;
			color: var(--violet-800);
			background: var(--violet-100);
			font-weight: bold;
		}

		.answer.selected {
			border-color: var(--violet-800);
			color: var(--white);
			background: var(--violet-800);
		}

		.answer.selected .answer-letter {
			color: var(--white);
			background: var(--violet-600);
		}

		.restart-button {
		display: block;
		margin: 24px 0 0 auto;
		padding: 13px 22px;
		border: 0;
		border-radius: 999px;
		color: var(--white);
		background: var(--violet-800);
		cursor: pointer;
		font-family: 'Trebuchet MS', sans-serif;
		font-size: 0.9rem;
		font-weight: bold;
		transition: background 180ms ease, transform 180ms ease;
		}

		.restart-button:hover {
			background: var(--violet-600);
			transform: translateY(-2px);
		}

		.feedback {
			min-height: 24px;
			margin: 18px 0 0;
			color: var(--muted);
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.88rem;
			font-weight: bold;
			line-height: 1.4;
		}

		.feedback.correct-message {
			color: #247355;
		}

		.feedback.incorrect-message {
			color: #9b3f32;
		}

		.results {
			padding: 44px 28px;
			border-radius: 14px;
			color: var(--white);
			background: var(--violet-800);
			text-align: center;
			box-shadow: 0 18px 45px rgba(77, 39, 128, 0.2);
		}

		.results h2 {
			margin: 0 0 12px;
			font-size: clamp(2rem, 6vw, 3.5rem);
			font-weight: normal;
		}

		.results p {
			margin: 0;
			font-family: 'Trebuchet MS', sans-serif;
			line-height: 1.6;
		}

		.results .player-name {
			margin-top: 12px;
			color: #ddccff;
			font-size: 1rem;
		}

		.results .score {
			margin: 20px 0;
			color: #ddccff;
			font-size: 2.5rem;
			font-weight: bold;
		}

		.results .experience {
			margin-top: 10px;
			color: var(--white);
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 1rem;
			font-weight: bold;
		}

		.leaderboard {
			max-width: 520px;
			margin: 32px auto 0;
			padding-top: 22px;
			border-top: 1px solid rgba(255, 255, 255, 0.25);
			text-align: left;
		}

		.leaderboard h3 {
			margin: 0 0 12px;
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.75rem;
			letter-spacing: 0.16em;
			text-align: center;
			text-transform: uppercase;
		}

		.ranking-list {
			display: grid;
			gap: 7px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.ranking-item {
			display: grid;
			grid-template-columns: 34px 1fr auto;
			align-items: center;
			gap: 10px;
			padding: 9px 12px;
			border-radius: 7px;
			background: rgba(255, 255, 255, 0.12);
			font-family: 'Trebuchet MS', sans-serif;
			font-size: 0.86rem;
		}

		.rank {
			display: grid;
			width: 25px;
			height: 25px;
			place-items: center;
			border-radius: 50%;
			color: var(--violet-800);
			background: var(--white);
			font-weight: bold;
		}

		.ranking-name {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.ranking-score {
			color: #ddccff;
			font-size: 0.78rem;
			font-weight: bold;
		}

		.confetti-piece {
			position: fixed;
			z-index: 10;
			top: -14px;
			width: 9px;
			height: 15px;
			pointer-events: none;
			animation: confetti-fall 2.8s ease-in forwards;
		}

		@keyframes confetti-fall {
			0% {
				top: -14px;
				opacity: 1;
				transform: translateX(0) rotate(0deg);
			}
			100% {
				top: 105vh;
				opacity: 0;
				transform: translateX(var(--drift)) rotate(720deg);
			}
		}

		.results .restart-button {
			margin: 24px auto 0;
			color: var(--violet-800);
			background: var(--white);
		}

		.results .restart-button:hover {
			background: var(--violet-100);
		}

		@media (max-width: 700px) {
			header {
				padding: 20px 18px;
			}

			main {
				padding-top: 38px;
			}

			.name-form {
				flex-direction: column;
			}
		}
	</style>
</head>
<body>
	<header>
		<div class="brand"><span class="brand-mark" aria-hidden="true"></span> Planet quiz</div>
		<a class="home-link" href="INDEX.html" aria-label="Go back home" title="Go back home">&#8592;</a>
	</header>

	<main>
		<div class="quiz-heading">
			<button class="reset-leaderboard" type="button">Hard quiz</button>
			<h1>From the Big Bang to Life Today</h1>
		</div>
		<div id="quiz-app" aria-live="polite"></div>
	</main>

	<script>
		const questions = [
			['Which observation provides the strongest direct evidence that the universe is expanding?', ['The phases of Venus', "Earth's magnetic field", 'The existence of asteroid belts', 'The redshift of distant galaxies'], 3],
			['Why is the cosmic microwave background considered strong evidence for the Big Bang model?', ['It is leftover radiation from the early hot universe', 'It is energy emitted by black holes today', 'It is sunlight scattered between galaxies', 'It is radiation produced only by modern stars'], 0],
			['Which sequence best represents major stages after the Big Bang?', ['Stars → atoms → nuclei → galaxies', 'Expansion and cooling → nuclei → atoms → stars and galaxies', 'Atoms → nuclei → stars → expansion', 'Galaxies → stars → nuclei → atoms'], 1],
			['What primarily caused the early universe to become suitable for the formation of neutral atoms?', ['Cosmic expansion lowered the temperature', 'The first galaxies heated the universe', 'Supernovae created all neutral atoms', "Earth's formation reduced cosmic temperature"], 0],
			['Which process best explains how a rotating cloud of gas and dust could develop into a star surrounded by a planetary disk?', ['Radioactive decay causing the cloud to expand', 'Solar radiation pushing all material inward', "Earth's gravity pulling material toward the Sun", 'Gravitational collapse with conservation of angular momentum'], 3],
			['Why are the inner planets of the Solar System predominantly rocky while the outer planets contain much more hydrogen and helium?', ['Rock cannot exist beyond the asteroid belt', 'The outer planets formed before the Sun', "Hydrogen could only form outside Earth's orbit", 'The inner region was too warm for most volatile materials to condense'], 3],
			['Which process most directly explains why many planetesimals could eventually form larger planetary bodies?', ['Photosynthesis in the protoplanetary disk', 'Accretion through repeated collisions', 'Evaporation of all solid material', 'Nuclear fusion between rocks'], 1],
			["What is the best explanation for Earth's early differentiation into layers such as the core, mantle, and crust?", ['Ocean currents separated the interior', 'Dense materials sank while less-dense materials rose', "Earth's atmosphere formed the core", 'All materials remained evenly mixed'], 1],
			['Which event is most strongly associated with the origin of the Moon under the giant-impact hypothesis?', ['The Sun expelled the Moon as a finished body', 'The asteroid belt split into two moons', 'Earth captured a fully formed galaxy', 'A large impact with the young Earth ejected material into orbit'], 3],
			['Which characteristic makes Earth especially suitable for long-term surface liquid water compared with many other Solar System bodies?', ['Its combination of suitable temperature, atmospheric pressure, and water availability', 'Its surface being entirely frozen', 'Its location inside the Sun', 'Its complete absence of an atmosphere'], 0],
			['Which statement best describes the relationship between the earliest known life and oxygen-rich Earth\'s atmosphere?', ['Oxygen was abundant before any life existed', 'Complex animals produced the first atmospheric oxygen', 'Plants created oxygen before microorganisms existed', 'Early life existed before oxygen became abundant in the atmosphere'], 3],
			['What was the major biological significance of oxygenic photosynthesis?', ['It stopped cellular respiration', 'It enabled organisms to release oxygen as a major environmental byproduct', 'It immediately produced complex animals', 'It eliminated the need for sunlight'], 1],
			['Why is the Cambrian Explosion scientifically significant?', ['It was the first appearance of any cellular life', 'It marks the formation of Earth itself', 'It was the extinction of all marine organisms', 'Many major animal body plans became evident in the fossil record over a relatively short geological interval'], 3],
			['Which mechanism is the fundamental source of genetic variation that can provide new alleles in populations?', ['Photosynthesis', 'Ecological succession', 'Mutation', 'Natural selection alone'], 2],
			['A population becomes geographically isolated and, after many generations, the isolated groups can no longer successfully interbreed. Which evolutionary process does this best illustrate?', ['Allopatric speciation', 'Geological weathering', 'Artificial selection', 'Photosynthetic adaptation'], 0],
			['Why are fossils useful for reconstructing the history of life even though the fossil record is incomplete?', ['Every organism becomes a fossil', 'Fossils directly record every evolutionary change', 'They provide preserved evidence of organisms and biological structures from different geological times', 'Fossils contain complete DNA from every extinct species'], 2],
			['Which sequence correctly orders these major events from oldest to youngest?', ['Earliest life → Earth forms → dinosaurs → oxygenation → humans', 'Oxygenation → Earth forms → earliest life → humans → dinosaurs', 'Earth forms → earliest life → oxygenation → dinosaurs → modern humans', 'Earth forms → dinosaurs → earliest life → humans → oxygenation'], 2],
			['What does the principle of common ancestry imply about all known living organisms?', ['They share evolutionary ancestry through populations of earlier organisms', 'They all evolved simultaneously from identical species', 'They all have identical genomes', 'They must occupy the same environment'], 0],
			["Which evidence most strongly supports the idea that Earth's present biodiversity resulted from long-term evolutionary change?", ['Only the presence of volcanic rocks', 'Only the existence of different climates', 'Only the age of the Moon', 'Agreement among fossils, comparative anatomy, genetics, and biogeography'], 3],
			['Which statement best summarizes the scientific timeline from the Big Bang to present-day life?', ['Life formed before stars and galaxies', 'Cosmic expansion and structure formation preceded Solar System formation, Earth formation, life, and biological evolution', 'Earth formed immediately after the Big Bang', 'Modern humans appeared before complex multicellular life'], 1]
		];

		const letters = ['A', 'B', 'C', 'D'];
		const quizApp = document.querySelector('#quiz-app');
		const playerStorageKey = 'planetQuizPlayerName';
		const leaderboardStorageKey = 'planetQuizLeaderboard';
		const resetLeaderboardButton = document.querySelector('.reset-leaderboard');
		let playerName = localStorage.getItem(playerStorageKey) || '';
		let currentQuestion = 0;
		let score = 0;
		let experience = 0;
		let answerStreak = 0;
		let experienceMultiplier = 1;
		let timerInterval;
		let transitionTimeout;

		resetLeaderboardButton.addEventListener('click', () => {
			localStorage.setItem(leaderboardStorageKey, '[]');
			document.querySelectorAll('.ranking-item').forEach((item, index) => {
				item.innerHTML = `<span class="rank">${index + 1}</span><span class="ranking-name">Open spot</span><span class="ranking-score">—</span>`;
			});
		});

		function escapeHtml(value) {
			return value.replace(/[&<>'"]/g, (character) => ({
				'&': '&amp;',
				'<': '&lt;',
				'>': '&gt;',
				"'": '&#39;',
				'"': '&quot;'
			}[character]));
		}

		function getLeaderboard() {
			try {
				const savedEntries = JSON.parse(localStorage.getItem(leaderboardStorageKey) || '[]');
				return Array.isArray(savedEntries) ? savedEntries.filter((entry) => entry && typeof entry.name === 'string') : [];
			} catch (error) {
				return [];
			}
		}

		function saveResult() {
			const entries = getLeaderboard();
			const matchingEntry = entries.find((entry) => entry.name.toLowerCase() === playerName.toLowerCase());
			const newResult = { name: playerName, experience, score };
			if (matchingEntry) {
				const isBetterResult = experience > matchingEntry.experience || (experience === matchingEntry.experience && score > matchingEntry.score);
				if (isBetterResult) Object.assign(matchingEntry, newResult);
			} else {
				entries.push(newResult);
			}
			entries.sort((first, second) => second.experience - first.experience || second.score - first.score);
			const savedEntries = entries.slice(0, 50);
			localStorage.setItem(leaderboardStorageKey, JSON.stringify(savedEntries));
			return savedEntries.slice(0, 3);
		}

		function renderNameSetup() {
			quizApp.innerHTML = `
				<section class="player-setup">
					<h2>Welcome to the journey</h2>
					<p>Enter your name so we can save your quiz progress and score.</p>
					<form class="name-form">
						<label class="sr-only" for="player-name">Your name</label>
						<input class="name-input" id="player-name" name="playerName" type="text" maxlength="40" placeholder="Enter your name" value="${escapeHtml(playerName)}" autocomplete="name" required>
						<button class="name-submit" type="submit">Save name</button>
					</form>
					<p class="name-error" aria-live="polite"></p>
				</section>`;

			const nameForm = quizApp.querySelector('.name-form');
			const nameInput = quizApp.querySelector('.name-input');
			const nameError = quizApp.querySelector('.name-error');
			nameInput.focus();
			nameForm.addEventListener('submit', (event) => {
				event.preventDefault();
				const enteredName = nameInput.value.trim();
				if (!enteredName) {
					nameError.textContent = 'Please enter your name to continue.';
					nameInput.focus();
					return;
				}
				playerName = enteredName;
				localStorage.setItem(playerStorageKey, playerName);
				renderQuestion();
			});
		}

		function renderQuestion() {
			clearInterval(timerInterval);
			clearTimeout(transitionTimeout);
			const [question, choices] = questions[currentQuestion];
			const progress = ((currentQuestion + 1) / questions.length) * 100;
			quizApp.innerHTML = `
				<div class="progress-row"><span>Hi, ${escapeHtml(playerName)}</span><span class="exp">EXP ${experience} · ${experienceMultiplier.toFixed(1)}x</span><span class="timer">15s</span><span>${currentQuestion + 1} of ${questions.length}</span></div>
				<div class="progress-track" aria-label="Quiz progress"><div class="progress-bar" style="width: ${progress}%"></div></div>
				<section class="question-card" aria-labelledby="question-text">
					<p class="question-number">Question ${currentQuestion + 1}</p>
					<h2 class="question-text" id="question-text">${question}</h2>
					<div class="answers" role="group" aria-label="Answer choices">
						${choices.map((choice, index) => `<button class="answer" type="button" data-answer="${index}"><span class="answer-letter">${letters[index]}</span><span>${choice}</span></button>`).join('')}
					</div>
					<p class="feedback" aria-live="polite"></p>
				</section>`;

			const answerButtons = quizApp.querySelectorAll('.answer');
			const timer = quizApp.querySelector('.timer');
			const feedback = quizApp.querySelector('.feedback');
			let timeLeft = 15;
			let questionLocked = false;

			function finishQuestion(selectedIndex) {
				if (questionLocked) return;
				questionLocked = true;
				clearInterval(timerInterval);
				answerButtons.forEach((button) => {
					button.disabled = true;
					if (Number(button.dataset.answer) === questions[currentQuestion][2]) button.classList.add('correct');
				});
				const isCorrect = selectedIndex === questions[currentQuestion][2];
				const multiplierUsed = experienceMultiplier;
				const earnedExperience = isCorrect ? Math.ceil((timeLeft / 15) * 15 * multiplierUsed) : 0;
				experience += earnedExperience;
				if (selectedIndex !== null) {
					answerButtons[selectedIndex].classList.add(isCorrect ? 'correct' : 'incorrect');
				}
				if (isCorrect) {
					score++;
					answerStreak++;
					experienceMultiplier = Math.min(1 + answerStreak * 0.5, 2);
					feedback.textContent = `Correct! EXP +${earnedExperience} (${multiplierUsed.toFixed(1)}x). Moving to the next question...`;
					feedback.classList.add('correct-message');
				} else {
					answerStreak = 0;
					experienceMultiplier = 1;
					feedback.textContent = `Correct answer: ${letters[questions[currentQuestion][2]]}. ${choices[questions[currentQuestion][2]]} EXP +0. Streak reset.`;
					feedback.classList.add('incorrect-message');
				}
				transitionTimeout = setTimeout(() => {
					currentQuestion++;
					if (currentQuestion < questions.length) renderQuestion();
					else renderResults();
				}, 1000);
			}

			answerButtons.forEach((button) => {
				button.addEventListener('click', () => {
					if (questionLocked) return;
					button.classList.add('selected');
					finishQuestion(Number(button.dataset.answer));
				});
			});
			timerInterval = setInterval(() => {
				timeLeft--;
				timer.textContent = `${timeLeft}s`;
				if (timeLeft <= 3) timer.classList.add('warning');
				if (timeLeft === 0) finishQuestion(null);
			}, 1000);
		}

		function renderResults() {
			const topPlayers = saveResult();
			const rankingRows = [0, 1, 2].map((rankIndex) => {
				const player = topPlayers[rankIndex];
				return `<li class="ranking-item"><span class="rank">${rankIndex + 1}</span><span class="ranking-name">${player ? escapeHtml(player.name) : 'Open spot'}</span><span class="ranking-score">${player ? `${player.experience} EXP · ${player.score}/${questions.length}` : '—'}</span></li>`;
			}).join('');
			quizApp.innerHTML = `
				<section class="results" aria-live="polite">
					<p class="question-number">Quiz complete</p>
					<h2>Journey finished.</h2>
					<p class="player-name">Player: ${escapeHtml(playerName)}</p>
					<div class="score">${score} / ${questions.length}</div>
					<p class="experience">Total EXP: ${experience}</p>
					<p>You made it from the Big Bang to life today.</p>
					<div class="leaderboard">
						<h3>Leaderboard</h3>
						<ol class="ranking-list">${rankingRows}</ol>
					</div>
					<button class="restart-button" type="button">Try again</button>
				</section>`;
			quizApp.querySelector('.restart-button').addEventListener('click', () => {
				clearTimeout(transitionTimeout);
				clearInterval(timerInterval);
				currentQuestion = 0;
				score = 0;
				experience = 0;
				answerStreak = 0;
				experienceMultiplier = 1;
				renderQuestion();
			});
			launchConfetti();
		}

		function launchConfetti() {
			const colors = ['#4d2780', '#8254d6', '#d7c4ff', '#f3c969', '#ffffff'];
			const confetti = document.createDocumentFragment();
			for (let index = 0; index < 70; index++) {
				const piece = document.createElement('span');
				piece.className = 'confetti-piece';
				piece.style.left = `${Math.random() * 100}%`;
				piece.style.backgroundColor = colors[index % colors.length];
				piece.style.setProperty('--drift', `${Math.round(Math.random() * 240 - 120)}px`);
				piece.style.animationDelay = `${Math.random() * 0.45}s`;
				confetti.appendChild(piece);
			}
			document.body.appendChild(confetti);
			setTimeout(() => document.querySelectorAll('.confetti-piece').forEach((piece) => piece.remove()), 3500);
		}

		renderNameSetup();
	</script>
</body>
</html>
